<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Kids — Log In</title>
  <link rel="icon" type="image/png" href="../assets/images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#10184b;--purple:#4b16ef;--purple2:#711cff;--blue:#1688ff;--yellow:#ffc928;--line:#e8e8f7}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,Arial,sans-serif;color:var(--navy);background:linear-gradient(135deg,#10025f,#4930e4);min-height:100vh}
a{text-decoration:none}
.page-header{height:82px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 5%;box-shadow:0 8px 25px rgba(0,0,0,.12)}
.brand{font-family:"Baloo 2",sans-serif;font-size:30px;font-weight:800;color:#ff9d00}.brand b{color:#5422ef}
.back{color:var(--purple);font-weight:800}
.page-main{min-height:calc(100vh - 82px);display:grid;place-items:center;padding:40px 20px}
.auth-card{width:min(520px,100%);background:#fff;border-radius:24px;padding:38px;box-shadow:0 24px 60px rgba(11,5,77,.3)}
.auth-card h1{font:800 42px "Baloo 2",sans-serif;text-align:center;margin:0}
.subtitle{text-align:center;color:#606887;margin:2px 0 28px}
label{display:block;font-weight:800;margin:16px 0 7px}
input,select{width:100%;padding:14px;border:1px solid #ced2e8;border-radius:10px;font:600 16px Nunito,sans-serif}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.submit{width:100%;border:0;border-radius:10px;padding:15px;margin-top:24px;background:linear-gradient(135deg,var(--purple2),var(--purple));color:#fff;font:800 17px Nunito,sans-serif;cursor:pointer}
.helper{text-align:center;margin-top:18px}.helper a{color:var(--purple);font-weight:800}
.status{min-height:22px;text-align:center;color:var(--purple);font-weight:800;margin-top:14px}
@media(max-width:560px){.page-header{height:68px}.page-main{min-height:calc(100vh - 68px)}.auth-card{padding:26px 20px}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="page-header">
  <a class="brand" href="../index.html"><b>AI</b> Kids</a>
  <a class="back" href="../index.html">← Home</a>
</header>
<main class="page-main">
<form class="auth-card" id="login-form">
  <h1>Log In</h1>
  <p class="subtitle">Welcome back! Continue your AI learning adventure.</p>
  <label for="email">Email Address</label>
  <input id="email" name="email" type="email" autocomplete="email" required placeholder="parent@example.com">
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Enter your password">
  <button class="submit" type="submit">Log In</button>
  <div class="status" id="status" role="status"></div>
  <p class="helper">New to AI Kids? <a href="signup.html">Create an account</a></p>
</form>
</main>
<script>
document.getElementById('login-form').addEventListener('submit', function(event){
  event.preventDefault();
  document.getElementById('status').textContent = 'Login interface is ready for backend authentication.';
});
</script>
</body>
</html>
