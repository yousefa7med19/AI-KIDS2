<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>AI Kids — Reset Password</title>

  <link rel="icon" type="image/png" href="../assets/images/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root{
      --navy:#10184b;
      --purple:#4b16ef;
      --purple2:#711cff;
      --text-soft:#68708d;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      font-family:Nunito,Arial,sans-serif;
      color:var(--navy);
      background:linear-gradient(135deg,#10025f,#4930e4);
    }

    a{
      text-decoration:none;
    }

    .page-header{
      height:82px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 5%;
      background:#fff;
      box-shadow:0 8px 25px rgba(0,0,0,.12);
    }

    .brand{
      font:800 30px "Baloo 2",sans-serif;
      color:#ff9d00;
    }

    .brand b{
      color:#5422ef;
    }

    .back{
      color:var(--purple);
      font-weight:800;
    }

    .page-main{
      min-height:calc(100vh - 82px);
      display:grid;
      place-items:center;
      padding:40px 20px;
    }

    .auth-card{
      width:min(520px,100%);
      padding:38px;
      border-radius:24px;
      background:#fff;
      box-shadow:0 24px 60px rgba(11,5,77,.3);
    }

    .auth-card h1{
      margin:0;
      text-align:center;
      font:800 42px "Baloo 2",sans-serif;
    }

    .subtitle{
      margin:4px 0 28px;
      color:var(--text-soft);
      text-align:center;
      line-height:1.6;
    }

    label{
      display:block;
      margin:16px 0 7px;
      font-weight:800;
    }

    input{
      width:100%;
      padding:14px;
      border:1px solid #ced2e8;
      border-radius:10px;
      font:600 16px Nunito,sans-serif;
    }

    input:focus{
      outline:3px solid rgba(75,22,239,.12);
      border-color:var(--purple);
    }

    .submit{
      width:100%;
      margin-top:24px;
      padding:15px;
      border:0;
      border-radius:10px;
      color:#fff;
      background:linear-gradient(135deg,var(--purple2),var(--purple));
      font:800 17px Nunito,sans-serif;
      cursor:pointer;
    }

    .submit:disabled{
      cursor:not-allowed;
      opacity:.65;
    }

    .status{
      min-height:22px;
      margin-top:14px;
      text-align:center;
      font-weight:800;
    }

    .helper{
      margin-top:18px;
      text-align:center;
    }

    .helper a{
      color:var(--purple);
      font-weight:800;
    }

    @media(max-width:560px){
      .page-header{
        height:68px;
      }

      .page-main{
        min-height:calc(100vh - 68px);
      }

      .auth-card{
        padding:26px 20px;
      }
    }
  </style>
</head>

<body>
  <header class="page-header">
    <a class="brand" href="../index.html">
      <b>AI</b> Kids
    </a>

    <a class="back" href="login.html">
      ← Log In
    </a>
  </header>

  <main class="page-main">
    <form class="auth-card" id="reset-password-form">
      <h1>Reset Password</h1>

      <p class="subtitle">
        Create a new secure password for your parent account.
      </p>

      <label for="password">New Password</label>

      <input
        id="password"
        type="password"
        autocomplete="new-password"
        minlength="8"
        required
        placeholder="At least 8 characters"
      >

      <label for="confirm-password">Confirm Password</label>

      <input
        id="confirm-password"
        type="password"
        autocomplete="new-password"
        minlength="8"
        required
        placeholder="Repeat your new password"
      >

      <button class="submit" type="submit">
        Reset Password
      </button>

      <div class="status" id="status" role="status"></div>

      <p class="helper">
        Back to
        <a href="login.html">Log in</a>
      </p>
    </form>
  </main>

  <script>
    const API_URL = 'http://localhost:5000/api';

    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    const form = document.getElementById('reset-password-form');
    const statusElement = document.getElementById('status');
    const submitButton = form.querySelector('.submit');

    if (!token) {
      statusElement.style.color = 'red';
      statusElement.textContent = 'Reset token is missing.';
      submitButton.disabled = true;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const password = document.getElementById('password').value;
      const confirmPassword =
        document.getElementById('confirm-password').value;

      if (password !== confirmPassword) {
        statusElement.style.color = 'red';
        statusElement.textContent = 'Passwords do not match.';
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = 'Resetting...';

      statusElement.textContent = '';

      try {
        const response = await fetch(
          `${API_URL}/auth/reset-password/${token}`,
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ password })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.message || 'Unable to reset password'
          );
        }

        statusElement.style.color = 'green';
        statusElement.textContent = data.message;

        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1200);
      } catch (error) {
        statusElement.style.color = 'red';
        statusElement.textContent = error.message;
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Reset Password';
      }
    });
  </script>
</body>
</html>
